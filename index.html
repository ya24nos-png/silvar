<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silvera - Precious Gift</title>
    <!-- ربط ملف الـ CSS -->
    <link rel="stylesheet" href="index.css">
    <!-- خطوط براند Silvera -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <h1 class="brand-title">Silvera</h1>
        <p class="subtitle">Someone left something precious for you</p>

        <!-- شاشة قفل التاريخ -->
        <div id="lock-screen" class="card">
            <p>Enter the special date to unlock your gift</p>
            <input type="text" id="passcode" placeholder="e.g. 06/06/2025">
            <button onclick="checkPasscode()">Unlock Experience</button>
            <p id="error-msg" class="error"></p>
        </div>

        <!-- محتوى الهدية -->
        <div id="gift-content" class="card hidden">
            <h2 id="custom-message"></h2>
            
            <div class="media-container">
                <img id="img1" src="" alt="Memory 1" class="hidden">
                <img id="img2" src="" alt="Memory 2" class="hidden">
            </div>

            <audio id="audio-player" controls class="hidden"></audio>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzfXoTdvST-GjKi772pzV7dUNSo7DKndEAogFAZGkyhtzpwVMOh4-Xdw-qLqLC8UOvY/exec"; 

        let customerData = null;

        const urlParams = new URLSearchParams(window.location.search);
        const customerId = urlParams.get('id');

        if (customerId) {
            fetch(`${SCRIPT_URL}?id=${customerId}`)
                .then(res => res.json())
                .then(data => {
                    if (data && !data.error) {
                        customerData = data;
                        console.log("Fetched Data:", customerData); // لطباعة البيانات في الكونسول للتأكد
                    } else {
                        console.error("Gift details not found!");
                    }
                })
                .catch(err => console.error("Error fetching data:", err));
        }

        // دالة لتنظيف وصياغة التاريخ لمنع أي اختلاف في الفورمات
        function cleanDate(str) {
            if (!str) return "";
            // تحويل صيغة التاريخ المرجعة من جوجل لو كانت ISO String
            if (str.includes("T")) {
                str = str.split("T")[0];
            }
            // إزالة أي مسافات وأصفار على الشمال في الأرقام
            return str.toString().trim().replace(/^0+/, '').replace(/\/-0+/g, '/').replace(/-0+/g, '-');
        }

        function checkPasscode() {
            const inputDate = document.getElementById('passcode').value.trim();
            const errorMsg = document.getElementById('error-msg');
            
            if (!customerData) {
                errorMsg.innerText = "Loading data... Please wait 2 seconds and try again.";
                return;
            }

            // مقارنة التاريخ المدخل مع التاريخ الجاي من الشيت بعد التنظيف
            const formattedInput = cleanDate(inputDate);
            const formattedBackend = cleanDate(customerData.date);

            if (formattedInput === formattedBackend || inputDate === customerData.date) {
                document.getElementById('lock-screen').classList.add('hidden');
                document.getElementById('gift-content').classList.remove('hidden');

                document.getElementById('custom-message').innerText = customerData.message;

                if (customerData.img1) {
                    const img1 = document.getElementById('img1');
                    img1.src = customerData.img1;
                    img1.classList.remove('hidden');
                }
                if (customerData.img2) {
                    const img2 = document.getElementById('img2');
                    img2.src = customerData.img2;
                    img2.classList.remove('hidden');
                }
                if (customerData.song || customerData.voice) {
                    const audio = document.getElementById('audio-player');
                    audio.src = customerData.song || customerData.voice;
                    audio.classList.remove('hidden');
                }
            } else {
                errorMsg.innerText = "Incorrect date. Please try again.";
            }
        }
    </script>
</body>
</html>
