<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Silvera — Your Special Gift</title>
    <meta name="description" content="A precious gift awaits you. Open it with your special date.">

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Silvera — Your Special Gift">
    <meta property="og:description" content="A precious gift awaits you. Open it with your special date.">
    <meta property="og:type" content="website">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <!-- Particle Canvas Background -->
    <canvas id="particles-canvas"></canvas>

    <main class="app-container">

        <!-- ============================================================
             SCREEN 1: SPLASH (Landing)
             ============================================================ -->
        <section id="splash" class="screen active">
            <div class="screen-inner">
                <h1 class="brand-name">Silvera</h1>
                <p class="tagline">Someone left something precious for you</p>

                <div id="loading-state" class="loading-state">
                    <div class="spinner"></div>
                    <p class="loading-text">Preparing your gift...</p>
                </div>

                <button id="btn-open" class="btn-primary" style="display:none;">
                    Open Your Gift
                </button>
            </div>
        </section>

        <!-- ============================================================
             SCREEN 2: UNLOCK (Date Entry)
             ============================================================ -->
        <section id="unlock" class="screen">
            <div class="screen-inner">
                <!-- Lock Icon (SVG) -->
                <div id="lock-icon" class="lock-icon">
                    <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="12" y="28" width="40" height="30" rx="6" stroke="currentColor" stroke-width="2.5" fill="none"/>
                        <path id="lock-shackle" d="M20 28V20C20 13.4 25.4 8 32 8C38.6 8 44 13.4 44 20V28" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                        <circle cx="32" cy="42" r="4" fill="currentColor"/>
                        <line x1="32" y1="46" x2="32" y2="52" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                    </svg>
                </div>

                <h2 class="screen-heading">Enter your special date</h2>
                <p class="screen-subtext">The date that means everything to both of you</p>

                <form id="unlock-form">
                    <div class="date-inputs">
                        <select id="select-day" class="date-select" required>
                            <option value="" disabled selected>Day</option>
                        </select>
                        <select id="select-month" class="date-select" required>
                            <option value="" disabled selected>Month</option>
                        </select>
                        <select id="select-year" class="date-select" required>
                            <option value="" disabled selected>Year</option>
                        </select>
                    </div>

                    <p id="unlock-error" class="error-msg"></p>
                    <p id="unlock-attempts" class="attempts-text"></p>

                    <button type="submit" id="btn-unlock" class="btn-primary">Unlock</button>
                </form>
            </div>
        </section>

        <!-- ============================================================
             SCREEN 3: REVEAL (The Surprise)
             ============================================================ -->
        <section id="reveal" class="screen">
            <div class="screen-inner reveal-inner">
                <header class="reveal-header reveal-animate">
                    <h2 id="reveal-heading" class="reveal-heading-text">From — to —</h2>
                </header>

                <div id="message-box" class="message-box reveal-animate">
                    <p id="message-text" class="message-text"></p>
                </div>

                <div id="gallery-section" class="gallery-section reveal-animate" style="display:none;">
                    <div id="photo-gallery" class="photo-gallery">
                        <!-- Photos injected by JS -->
                    </div>
                </div>

                <div id="music-section" class="media-container reveal-animate" style="display:none;">
                    <!-- Music iframe injected by JS -->
                </div>

                <div id="video-section" class="media-container reveal-animate" style="display:none;">
                    <!-- Video iframe injected by JS -->
                </div>

                <footer class="reveal-footer reveal-animate">
                    <p>Crafted with love · <span class="brand-accent">Silvera</span></p>
                </footer>
            </div>
        </section>

        <!-- ============================================================
             SCREEN 4: ERROR
             ============================================================ -->
        <section id="error" class="screen">
            <div class="screen-inner">
                <h1 class="brand-name brand-name--small">Silvera</h1>
                <div class="error-icon">
                    <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" width="64" height="64">
                        <circle cx="32" cy="32" r="28" stroke="currentColor" stroke-width="2" fill="none" opacity="0.4"/>
                        <line x1="22" y1="22" x2="42" y2="42" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
                        <line x1="42" y1="22" x2="22" y2="42" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
                    </svg>
                </div>
                <p id="error-text" class="error-screen-text">This gift doesn't exist.</p>
                <p class="error-screen-sub">Please make sure you scanned the correct QR code.</p>
            </div>
        </section>

    </main>

    <!-- ============================================================
         LIGHTBOX (Full-screen photo viewer)
         ============================================================ -->
    <div id="lightbox" class="lightbox">
        <button id="lightbox-close" class="lightbox-close" aria-label="Close">&times;</button>
        <img id="lightbox-img" src="" alt="Full size photo">
    </div>

    <!-- JavaScript -->
    <script src="index.js"></script>
</body>
</html>
